[project]
name = "housing-scraper"
version = "0.1.0"
description = "Aggregator scraper for short-term furnished housing (Blueground) — writes results to Excel"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48",
    "playwright-stealth>=1.0.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "click>=8.1",
    "aiolimiter>=1.1",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
scrape = "src.cli:cli"
scrape-server = "src.server:_run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
